    title: Read the banner
    category: misc
    points: 100
    min_points: 100        # no decay: everybody should get this one
    decay_solves: 1
    flag_sha256: "d43aad687d1a1650ecbd9994e5d75c69e65276984922fb9cd25dd0690d1a2693"

