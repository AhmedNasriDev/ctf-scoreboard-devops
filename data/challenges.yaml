# The competition.
#
# This file is data, not code. It is loaded at startup with yaml.safe_load and
# reconciled into the database: adding a challenge here and restarting adds it,
# changing one changes it, and running twice changes nothing.
#
# In a cluster this file can be replaced by a ConfigMap mounted at
# CHALLENGES_FILE: the same image then serves a different competition.
#
# Flags are stored as SHA-256 hashes so that this file can live in version
# control without giving the competition away. The plaintext flags for this
# demonstration set are in docs/FLAGS.md, which is for you while you develop --
# a real competition would not ship them.
#
#   slug          required, unique, URL-safe
#   title         required
#   category      optional, default "misc"   (used as a Prometheus label, so
#                                             keep the set small and fixed)
#   points        required, the base value
#   min_points    optional, default min(50, points) -- the decay floor
#   decay_solves  optional, default 10 -- solves over which the value falls
#   flag          plaintext; hashed at load time
#   flag_sha256   already hashed; use this one in version control

challenges:
