name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
 verify:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with: { python-version: "3.12", cache: pip }
    - name: install
      run: |
        pip install -r requirements-dev.txt
        pip install -e .
    - name: lint
      run: ruff check . && ruff format --check .
    - name: tests
      if: ${{ !cancelled() }}
      run: python -m pytest -q --cov=src/scoreboard --cov-fail-under=70
    - name: secret scan
      if: ${{ !cancelled() }}
      run: |
        GL=8.30.1
        URL=https://github.com/gitleaks/gitleaks/releases/download
        curl -sSL "$URL/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
          | tar -xz gitleaks
        ./gitleaks dir --redact --exit-code 1 .
    - name: dependency audit
      if: ${{ !cancelled() }}
      run: pip-audit -r requirements.txt

 image:
  needs: verify
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest
  permissions: { contents: read, packages: write }
  outputs:
    image: ${{ steps.name.outputs.image }}
    digest: ${{ steps.push.outputs.digest }}
  steps:
    - uses: actions/checkout@v6
    - id: name # image names must be lower case
      run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
        build-args: BUILD_SHA=${{ github.sha }}
